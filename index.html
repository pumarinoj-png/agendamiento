<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Agendamiento</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --surface-1: #ffffff;
            --border: #ddd;
            --bg-success: #d4edda;
            --bg-danger: #f8d7da;
            --fill-accent: #007bff;
            --fill-success: #28a745;
            --text-danger: #721c24;
            --text-success: #155724;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #e0e0e0;
                --text-secondary: #999;
                --surface-1: #262626;
                --border: #444;
            }
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: var(--text-primary); padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h2 { margin: 20px 0; font-size: 24px; }
        h3 { margin: 15px 0 10px; font-size: 18px; }
        h4 { margin: 10px 0 5px; }
        label { display: block; margin-top: 10px; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0 15px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; background: var(--surface-1); color: var(--text-primary); font-family: inherit; }
        button { padding: 10px 15px; margin: 5px 5px 5px 0; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
        .btn-primary { background: var(--fill-accent); color: white; }
        .btn-success { background: var(--fill-success); color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        button:hover { opacity: 0.9; }
        .alert { padding: 12px; margin: 10px 0; border-radius: 4px; }
        .alert-success { background: var(--bg-success); color: var(--text-success); }
        .alert-danger { background: var(--bg-danger); color: var(--text-danger); }
        .card { background: var(--surface-1); padding: 15px; margin: 10px 0; border: 1px solid var(--border); border-radius: 8px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
        .button-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .flex { display: flex; justify-content: space-between; align-items: center; }
        .scroll-list { max-height: 400px; overflow-y: auto; }
        small { display: block; margin: 5px 0; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        // Inicializar Supabase - SIN DUPLICADOS
        window.sbClient = null;
        
        function initSupabase() {
            const SUPABASE_URL = 'https://tkwbpnpsyoixmfsgswlo.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrd2JwbnBzeW9peG1mc2dzd2xvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MTUwMTYsImV4cCI6MjEwMzQ5MTAxNn0.rTRxzhBcMRvJq_LkOu164_MAQNzYlYogIvv0Nm1BOy4';
            
            if (!window.sbClient && window.supabase) {
                window.sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
            return window.sbClient;
        }

        // Estado
        let app = {
            page: 'home',
            blocks: [],
            reservations: [],
            adminCode: '2024COACH',
            form: {}
        };

        async function loadData() {
            try {
                const sb = initSupabase();
                if (!sb) {
                    setTimeout(loadData, 100);
                    return;
                }

                const { data: blocksData } = await sb.from('blocks').select('*');
                const { data: reservationsData } = await sb.from('reservations').select('*');
                
                app.blocks = blocksData || [];
                app.reservations = reservationsData || [];
                render();
            } catch (error) {
                console.error('Error:', error);
                setTimeout(loadData, 1000);
            }
        }

        function render() {
            const appDiv = document.getElementById('app');
            
            if (app.page === 'home') {
                appDiv.innerHTML = `
                    <div class="container">
                        <h2>Sistema de Agendamiento</h2>
                        <div class="button-group">
                            <button class="btn-primary" onclick="app.page='admin-login'; render()">Administrador</button>
                            <button class="btn-secondary" onclick="app.page='student'; render()">Participantes</button>
                            <button class="btn-secondary" onclick="app.page='change-reservation'; render()">Cambiar mi Reserva</button>
                        </div>
                    </div>
                `;
            }
            else if (app.page === 'admin-login') {
                appDiv.innerHTML = `
                    <div class="container" style="max-width: 400px;">
                        <button class="btn-secondary" onclick="app.page='home'; render()">← Volver</button>
                        <h2>Panel Administrador</h2>
                        <div class="card">
                            <label>Código de Acceso</label>
                            <input type="password" id="codeInput" placeholder="Ingresa el código">
                            <button class="btn-primary" onclick="checkCode()">Entrar</button>
                            <div id="codeMsg"></div>
                        </div>
                    </div>
                `;
                document.getElementById('codeInput').focus();
            }
            else if (app.page === 'admin') {
                renderAdmin();
            }
            else if (app.page === 'student') {
                renderStudent();
            }
            else if (app.page === 'change-reservation') {
                renderChangeReservation();
            }
        }

        function checkCode() {
            const code = document.getElementById('codeInput').value;
            if (code === app.adminCode) {
                app.page = 'admin';
                render();
            } else {
                document.getElementById('codeMsg').innerHTML = '<div class="alert alert-danger">Código incorrecto</div>';
            }
        }

        function renderAdmin() {
            const appDiv = document.getElementById('app');
            let html = `
                <div class="container">
                    <div class="flex">
                        <h2>Panel Administrador</h2>
                        <button class="btn-secondary" onclick="app.page='home'; render()">← Salir</button>
                    </div>
                    
                    <div class="grid-2">
                        <div class="card">
                            <h3>Crear Bloque</h3>
                            <label>Grupo</label>
                            <input type="text" id="blockGroup" placeholder="Ej: Grupo 01">
                            <label>Fecha</label>
                            <input type="date" id="blockDate">
                            <label>Horario (ej: 10:00-11:00)</label>
                            <input type="text" id="blockTime" placeholder="10:00-11:00">
                            <label>Coach</label>
                            <input type="text" id="blockCoach" placeholder="Nombre">
                            <button class="btn-primary" onclick="addBlock()">+ Agregar</button>
                            <div id="blockMsg"></div>
                        </div>

                        <div class="card">
                            <h3>Importar Bloques</h3>
                            <p><small>Copia 4 columnas desde Excel (Grupo | Fecha | Hora | Coach) y pega aquí</small></p>
                            <textarea id="importData" placeholder="Grupo 01&#9;30-sept&#9;09:30 - 10:30&#9;Fernanda Riesle" style="height: 120px;"></textarea>
                            <button class="btn-primary" onclick="importBlocks()">📤 Importar</button>
                            <div id="importMsg"></div>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Bloques (${app.blocks.length})</h3>
                        <div class="scroll-list">
                            ${app.blocks.map(b => `
                                <div style="padding: 10px; border-bottom: 1px solid var(--border);">
                                    <strong>${b.group_name}</strong> - ${b.date} ${b.time} (${b.coach})
                                    <small style="color: ${b.reserved ? 'red' : 'green'};">${b.reserved ? '🔴 Reservado' : '🟢 Disponible'}</small>
                                    <button class="btn-danger" onclick="deleteBlock(${b.id})" style="float: right;">Borrar</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="card">
                        <h3>Reservas (${app.reservations.length})</h3>
                        <div class="scroll-list">
                            ${app.reservations.map(r => `
                                <div style="padding: 10px; border-bottom: 1px solid var(--border);">
                                    <strong>${r.student_name}</strong><br>
                                    ${r.student_email}<br>
                                    <small>📅 ${r.block_date} ${r.block_time} (${r.coach})</small><br>
                                    <small>Opción 1: ${r.option1_date || '—'} ${r.option1 || '—'}</small><br>
                                    <small>Opción 2: ${r.option2_date || '—'} ${r.option2 || '—'}</small><br>
                                    <button class="btn-secondary" onclick="sendEmail(${r.id})">✉️ Email</button>
                                    <button class="btn-danger" onclick="deleteReservation(${r.id})">Cancelar</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <button class="btn-success" onclick="exportToExcel()">📥 Descargar Excel</button>
                </div>
            `;
            appDiv.innerHTML = html;
        }

        function renderStudent() {
            const appDiv = document.getElementById('app');
            const groups = [...new Set(app.blocks.map(b => b.group_name))].sort();
            
            appDiv.innerHTML = `
                <div class="container" style="max-width: 600px;">
                    <button class="btn-secondary" onclick="app.page='home'; render()">← Volver</button>
                    <h2>Participantes</h2>
                    <div class="card">
                        <p>Grupos disponibles: ${groups.length}</p>
                        ${groups.map(g => `
                            <button class="btn-primary" onclick="alert('Próximamente: Reservar en ' + '${g}')" style="width: 100%; text-align: left; margin: 10px 0;">
                                ${g} - ${app.blocks.filter(b => b.group_name === g && !b.reserved).length} sesiones
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderChangeReservation() {
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = `
                <div class="container" style="max-width: 600px;">
                    <button class="btn-secondary" onclick="app.page='home'; render()">← Volver</button>
                    <h2>Cambiar mi Reserva</h2>
                    <div class="card">
                        <p>Próximamente: Sistema de cambio de opciones</p>
                    </div>
                </div>
            `;
        }

        async function addBlock() {
            const group = document.getElementById('blockGroup').value;
            const date = document.getElementById('blockDate').value;
            const time = document.getElementById('blockTime').value;
            const coach = document.getElementById('blockCoach').value;
            
            if (!group || !date || !time || !coach) {
                document.getElementById('blockMsg').innerHTML = '<div class="alert alert-danger">Completa todos los campos</div>';
                return;
            }

            try {
                const sb = initSupabase();
                const [y, m, d] = date.split('-');
                const dateObj = `${d}/${m}/${y}`;
                
                const { error } = await sb.from('blocks').insert([{
                    id: Date.now(),
                    group_name: group,
                    date: dateObj,
                    time,
                    coach,
                    reserved: false
                }]);

                if (error) throw error;

                document.getElementById('blockGroup').value = '';
                document.getElementById('blockDate').value = '';
                document.getElementById('blockTime').value = '';
                document.getElementById('blockCoach').value = '';
                document.getElementById('blockMsg').innerHTML = '<div class="alert alert-success">✓ Bloque creado</div>';
                
                await loadData();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('blockMsg').innerHTML = '<div class="alert alert-danger">Error: ' + error.message + '</div>';
            }
        }

        async function importBlocks() {
            const data = document.getElementById('importData').value;
            if (!data.trim()) {
                document.getElementById('importMsg').innerHTML = '<div class="alert alert-danger">Pega datos primero</div>';
                return;
            }

            try {
                const sb = initSupabase();
                const lines = data.trim().split('\n');
                const blocksToInsert = [];
                const base = Date.now();
                let errores = 0;

                lines.forEach((line, i) => {
                    const parts = line.split('\t').map(p => p.trim()).filter(p => p !== '');
                    if (parts.length >= 4) {
                        blocksToInsert.push({
                            id: base + i,
                            group_name: parts[0],
                            date: parts[1],
                            time: parts[2],
                            coach: parts[3],
                            reserved: false
                        });
                    } else if (line.trim() !== '') {
                        errores++;
                    }
                });

                if (blocksToInsert.length > 0) {
                    const { error } = await sb.from('blocks').insert(blocksToInsert);
                    if (error) throw error;
                    
                    document.getElementById('importMsg').innerHTML = `<div class="alert alert-success">✓ Importados ${blocksToInsert.length} bloques${errores > 0 ? ` (${errores} líneas ignoradas)` : ''}</div>`;
                    document.getElementById('importData').value = '';
                    await loadData();
                } else {
                    document.getElementById('importMsg').innerHTML = '<div class="alert alert-danger">No se pudo leer. Formato: Grupo [TAB] Fecha [TAB] Hora [TAB] Coach</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('importMsg').innerHTML = '<div class="alert alert-danger">Error: ' + error.message + '</div>';
            }
        }

        async function deleteBlock(id) {
            try {
                const sb = initSupabase();
                await sb.from('reservations').delete().eq('block_id', id);
                await sb.from('blocks').delete().eq('id', id);
                await loadData();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function deleteReservation(id) {
            try {
                const sb = initSupabase();
                const res = app.reservations.find(r => r.id === id);
                if (res) {
                    await sb.from('blocks').update({ reserved: false }).eq('id', res.block_id);
                    await sb.from('reservations').delete().eq('id', id);
                    await loadData();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function sendEmail(id) {
            const res = app.reservations.find(r => r.id === id);
            if (res) {
                const subject = `Confirmación - ${res.coach}`;
                const body = `Hola ${res.student_name},\n\n✓ Reserva confirmada\n\nGrupo: ${res.group_name}\nFecha: ${res.block_date}\nHora: ${res.block_time}\nCoach: ${res.coach}\n\n¡Nos vemos!`;
                window.location.href = `mailto:${res.student_email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            }
        }

        function exportToExcel() {
            const data = app.reservations.map(r => ({
                Grupo: r.group_name,
                Nombre: r.student_name,
                Email: r.student_email,
                Fecha: r.block_date,
                Hora: r.block_time,
                Coach: r.coach
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Reservas');
            XLSX.writeFile(wb, 'reservas.xlsx');
        }

        // Iniciar
        loadData();
    </script>
</body>
</html>
